name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, lint commits from base branch
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
              bun run commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
            else
              echo "Base SHA not found, linting HEAD commit only"
              echo "$(git log -1 --pretty=%B)" | bun run commitlint --stdin
            fi
          else
            # For pushes, check if we have enough commits
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              bun run commitlint --from HEAD~1 --to HEAD --verbose
            else
              # First commit or shallow clone - lint only HEAD
              echo "Not enough commit history, linting HEAD only"
              echo "$(git log -1 --pretty=%B)" | bun run commitlint --stdin
            fi
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

